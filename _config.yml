title: "Pakistan Report"
description: "Pakistan. Explained."
url: "https://pakistanreport.pakistanreportnews.workers.dev"

lang: "en"
timezone: "Asia/Karachi"
plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

author:
  name: "Pakistan Report Editorial Desk"

permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
      author: "Pakistan Report Editorial Desk"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
