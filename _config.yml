title: "Pakistan Report"
description: "Pakistan. Explained."
url: "https://pakistanreport.pakistanreportnews.workers.dev"

lang: "en"
timezone: "Asia/Karachi"
plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

author:
  name: "Pakistan Report Editorial Desk"

permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
      author: "Pakistan Report Editorial Desk"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - wrangler.jsonc
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - _newsroom

# GA4 is configured for production; deployment remains on hold.
analytics:
  enabled: true
  measurement_id: "G-8J4QNEXRW4"
