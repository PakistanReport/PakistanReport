{% if jekyll.environment == 'production' and site.analytics.enabled == true and site.analytics.measurement_id != '' and site.analytics.measurement_id != nil %}
<script>
(function () {
  'use strict';
  const measurementId = {{ site.analytics.measurement_id | jsonify }};
  const productionOrigin = {{ site.url | jsonify }};
  if (!/^G-[A-Z0-9]+$/.test(measurementId) || window.location.origin !== productionOrigin) return;
  if (window.pakistanReportAnalyticsInstalled) return;
  window.pakistanReportAnalyticsInstalled = true;
  let started = false;

  // A future approved consent interface must set this choice. No default grant.
  function applyConsent(granted) {
    window['ga-disable-' + measurementId] = !granted;
    if (!granted) {
      if (started) window.location.reload();
      return;
    }
    if (started) return;
    started = true;
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', measurementId, {
      send_page_view: true,
      allow_google_signals: false,
      allow_ad_personalization_signals: false
    });
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
    document.head.appendChild(script);
  }

  window.addEventListener('pakistan-report:analytics-consent', function (event) {
    const granted = !!event.detail && event.detail.granted === true;
    window.pakistanReportAnalyticsConsent = granted;
    applyConsent(granted);
  });
  applyConsent(window.pakistanReportAnalyticsConsent === true);
}());
</script>
{% endif %}
