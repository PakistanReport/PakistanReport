<style>
.pr-analytics-preferences { background:transparent; color:#cbd4d0; border:1px solid #65716c; border-radius:3px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
#pr-analytics-notice[hidden] { display:none; }
#pr-analytics-notice { position:fixed; z-index:1000; bottom:16px; left:4%; right:4%; max-width:640px; margin:auto; max-height:70vh; overflow:auto; padding:18px; border:1px solid #064c3b; border-radius:4px; background:#fbfbf8; color:#111815; box-shadow:0 3px 18px #0002; font:14px/1.5 Arial,Helvetica,sans-serif; }
#pr-analytics-notice h2 { margin:0 0 6px; font:700 19px/1.3 Georgia,serif; }
#pr-analytics-notice p { margin:0 0 12px; }
#pr-analytics-notice a { color:#064c3b; text-decoration:underline; }
.pr-analytics-actions { display:flex; flex-wrap:wrap; gap:10px; }
.pr-analytics-actions button { flex:1; min-width:130px; padding:10px 14px; border:1px solid #064c3b; border-radius:3px; background:#fff; color:#064c3b; font:700 14px/1.4 Arial,Helvetica,sans-serif; cursor:pointer; }
.pr-analytics-actions button:hover { background:#e6eee9; }
.pr-analytics-actions button:focus-visible,.pr-analytics-preferences:focus-visible,#pr-analytics-notice a:focus-visible { outline:3px solid #08745a; outline-offset:3px; }
</style>
<section id="pr-analytics-notice" role="region" aria-labelledby="pr-analytics-title" hidden>
  <h2 id="pr-analytics-title">Your analytics choice</h2>
  <p>May we use Google Analytics cookies to understand which stories readers find useful? Analytics stays off unless you allow it. Your choice lasts 180 days and can be changed using Analytics preferences. <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a></p>
  <p id="pr-analytics-status" aria-live="polite"></p>
  <div class="pr-analytics-actions">
    <button type="button" id="pr-analytics-allow">Allow analytics</button>
    <button type="button" id="pr-analytics-decline">Decline</button>
  </div>
</section>
<script src="{{ '/assets/js/analytics-consent.js' | relative_url }}" defer></script>
