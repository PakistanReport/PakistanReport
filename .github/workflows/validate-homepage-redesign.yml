name: Validate homepage redesign
on:
  pull_request:
    paths:
      - 'index.html'
      - '_data/homepage_editorial.yml'
      - '_plugins/category_pagination.rb'
      - '_layouts/latest-archive.html'
      - 'latest/index.html'
      - 'pakistan-politics/index.html'
      - 'economy-business/index.html'
      - '.github/workflows/validate-homepage-redesign.yml'
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build production Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Verify generated homepage, SEO and editorial sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html = Path('_site/index.html').read_text()
          for heading in ["Editor's Picks", "In the News", "Latest News", "In Focus", "Pakistan &amp; Politics", "Economy &amp; Business", "World", "Technology", "More Headlines"]:
              assert heading in html or heading.replace("&amp;", "&") in html, f"Missing: {heading}"
          assert 'class="pr-category-grid"' in html, "Four-column layout missing"
          assert '{%' not in html, "Unrendered Liquid template"
          assert 'rel="canonical"' in html, "Homepage canonical missing"
          assert 'href="/pakistan/' in html or 'href="https://pakistanreport.pk/pakistan/' in html, "Pakistan article/category links missing"
          assert 'href="/world/' in html or 'href="https://pakistanreport.pk/world/' in html, "World article/category links missing"
          assert Path('_site/robots.txt').exists(), "robots.txt missing"
          assert Path('_site/sitemap.xml').exists(), "Sitemap missing"
          for archive in ["latest", "pakistan-politics", "economy-business"]:
              assert Path(f"_site/{archive}/index.html").exists(), f"Missing {archive} archive"
          latest = Path("_site/latest/index.html").read_text()
          assert 'aria-label="Latest stories pages"' in latest or latest.count('class="pr-archive-item"') <= 12, "Latest archive pagination missing"
          assert latest.count('class="pr-archive-item"') <= 12, "More than 12 stories on first latest page"
          print("Homepage and archive build smoke checks passed")
          PY
      - name: Install Chromium screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture real desktop homepage screenshot
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/pakistanreport-preview.log 2>&1 &
          echo $! > /tmp/pakistanreport-preview.pid
          mkdir -p visual-review
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1024, height: 768 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:8765/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(() => document.fonts.ready);
            await page.locator('.pr-home').waitFor();
            await page.screenshot({ path: 'visual-review/homepage-desktop-1024.png', fullPage: true, animations: 'disabled' });
            const data = await page.evaluate(() => ({
              viewport: { width: innerWidth, height: innerHeight },
              pageHeight: document.documentElement.scrollHeight,
              sections: Object.fromEntries(['.pr-desktop-header','.pr-lead-grid','.pr-news-strip','.pr-middle','.pr-focus-card','.pr-category-grid','.pr-more-list','.pr-desktop-footer'].map(selector => {
                const el = document.querySelector(selector);
                if (!el) return [selector, null];
                const r = el.getBoundingClientRect();
                return [selector, { x: Math.round(r.x), y: Math.round(r.y + scrollY), width: Math.round(r.width), height: Math.round(r.height) }];
              })),
              focusTextHeight: document.querySelector('.pr-focus-copy')?.getBoundingClientRect().height ?? null,
              focusImageHeight: document.querySelector('.pr-focus-card')?.getBoundingClientRect().height ?? null
            }));
            fs.writeFileSync('visual-review/measurements.json', JSON.stringify({ ...data, pageErrors: errors }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
      - name: Capture and check mobile homepage at 390px
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:8765/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(() => document.fonts.ready);
            await page.locator('.pr-home').waitFor();
            await page.screenshot({ path: 'visual-review/homepage-mobile-390.png', fullPage: true, animations: 'disabled' });
            const result = await page.evaluate(() => ({
              viewportWidth: innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              bodyWidth: document.body.scrollWidth,
              headings: [...document.querySelectorAll('.pr-home h2')].map(el => el.textContent.trim()),
              desktopHeaderVisible: (() => { const el = document.querySelector('.pr-desktop-header'); return el && getComputedStyle(el).display !== 'none'; })(),
              horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 2
            }));
            fs.writeFileSync('visual-review/mobile-measurements.json', JSON.stringify({ ...result, pageErrors: errors }, null, 2));
            if (result.horizontalOverflow) throw new Error('Mobile horizontal overflow: ' + JSON.stringify(result));
            if (errors.length) throw new Error('Mobile page JS errors: ' + errors.join('; '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
      - name: Upload desktop and mobile visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pakistanreport-homepage-desktop-mobile
          path: visual-review/
          if-no-files-found: warn
          retention-days: 14
