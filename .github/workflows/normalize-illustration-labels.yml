name: Clean normalized illustration captions
on:
  push:
    branches: [fix-ai-generated-image-labels]
    paths: [.github/workflows/normalize-illustration-labels.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove folded caption leftovers only
        shell: python
        run: |
          from pathlib import Path
          count = 0
          for path in Path('_posts').glob('*.md'):
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              output = []
              in_caption = False
              changed = False
              for line in lines:
                  if in_caption and (line.startswith(' ') or line.startswith('\\t')):
                      changed = True
                      continue
                  in_caption = line.strip() == 'image_caption: "Pakistan Report illustration"'
                  output.append(line)
              if changed:
                  path.write_text(''.join(output), encoding='utf-8')
                  count += 1
                  print(path)
          print('Cleaned files:', count)
      - name: Commit fixes
        run: |
          if ! git diff --quiet -- _posts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts
            git commit -m "Remove leftover wrapped AI image caption text"
            git push
          fi
