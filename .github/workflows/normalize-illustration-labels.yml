name: Audit all explicitly AI-labelled image metadata
on:
  push:
    branches: [fix-ai-generated-image-labels]
    paths: [.github/workflows/normalize-illustration-labels.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize remaining folded AI labels
        shell: python
        run: |
          from pathlib import Path
          import re
          import json
          changed_count = 0
          pattern = re.compile(r'AI[- ]generated|AI illustration', re.I)
          for path in Path('_posts').glob('*.md'):
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              if not lines or lines[0].strip() != '---':
                  continue
              output = []
              i = 0
              changed = False
              while i < len(lines):
                  line = lines[i]
                  if i > 0 and line.strip() == '---':
                      output.extend(lines[i:])
                      break
                  match = re.match(r'^(image_caption|image_alt):', line)
                  if not match:
                      output.append(line)
                      i += 1
                      continue
                  key = match.group(1)
                  j = i + 1
                  while j < len(lines) and (lines[j].startswith(' ') or lines[j].startswith('\\t')):
                      j += 1
                  block = ''.join(lines[i:j])
                  if not pattern.search(block):
                      output.extend(lines[i:j])
                      i = j
                      continue
                  if key == 'image_caption':
                      output.append('image_caption: "Pakistan Report illustration"\\n')
                  else:
                      raw = ' '.join(x.strip() for x in lines[i:j])
                      raw = raw.split(':', 1)[1].strip().strip('"').strip("'")
                      raw = re.sub(r'AI[- ]generated\\s*', '', raw, flags=re.I)
                      raw = re.sub(r'AI illustration', 'Illustration', raw, flags=re.I)
                      raw = re.sub(r'\\s+', ' ', raw).strip()
                      output.append('image_alt: ' + json.dumps(raw, ensure_ascii=False) + '\\n')
                  changed = True
                  i = j
              if changed:
                  path.write_text(''.join(output), encoding='utf-8')
                  changed_count += 1
                  print(path)
          print('Additional corrected files:', changed_count)
      - name: Commit additional changes
        run: |
          if ! git diff --quiet -- _posts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts
            git commit -m "Normalize remaining explicitly AI-labelled image metadata"
            git push
          fi
