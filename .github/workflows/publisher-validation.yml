name: Publisher validation

on:
  push:
    branches:
      - disable-facebook-publisher-reads
  pull_request:
    paths:
      - '_newsroom/publisher/**'
      - '.github/workflows/publisher-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-validation:
    name: Test and dry-run build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _newsroom/publisher
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _newsroom/publisher/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Publisher tests
        run: npm test
      - name: Wrangler dry-run build (no deployment)
        run: npm run check
