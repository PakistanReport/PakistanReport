name: Test category pagination build

on:
  pull_request:
    paths:
      - '_plugins/category_pagination.rb'
      - '_layouts/category.html'
      - '.github/workflows/test-category-pagination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Validate recent sections and monthly archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, xml.etree.ElementTree as ET
          root=Path('_site')
          class Page(HTMLParser):
              def __init__(self,path):
                  super().__init__();self.links=[];self.headlines=[];self.canon=[];self.cards=0
                  self.feed(path.read_text())
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a':
                      self.links.append(a.get('href',''))
                      if a.get('class')=='archive-headline': self.headlines.append(a['href'])
                  if tag=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href'))
                  if tag=='article' and a.get('class') in ('card','pr-archive-item'):self.cards+=1
          active=['pakistan','politics','economy','business','world','technology']
          sections=active+['latest','economy-business','pakistan-politics','iran-conflict','jobs']
          for section in sections:
              p=Page(root/section/'index.html')
              assert p.cards<=48,(section,p.cards)
              assert p.canon==['https://pakistanreport.pk/'+section+'/'],section
              assert not list((root/section).glob('page/*/index.html')),section
              assert not any(re.match(r'^/'+section+r'/page/\\d+/',x) for x in p.links),section
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls={e.text for e in ET.parse(root/'sitemap.xml').findall('.//s:loc',ns)}
          assert not any(re.search(r'/page/\\d+/$',u) for u in urls)
          landing=Page(root/'archive/index.html')
          months=list(root.glob('archive/*/*/index.html'))
          assert months
          linked=[]
          for f in months:
              path='/'+f.parent.relative_to(root).as_posix()+'/'
              assert path in landing.links,path
              p=Page(f)
              assert p.canon==['https://pakistanreport.pk'+path],path
              assert 'https://pakistanreport.pk'+path in urls,path
              linked.extend(p.headlines)
          assert len(linked)==len(set(linked)), 'Duplicate archive article links'
          for path in linked:
              assert (root/path.strip('/')/'index.html').is_file(),path
          # Every sitemap article with a publication timestamp must be in the archive.
          for url in urls:
              path=url.removeprefix('https://pakistanreport.pk')
              f=root/path.strip('/')/'index.html'
              if f.is_file() and 'article:published_time' in f.read_text():
                  assert path in linked, 'Missing article '+path
          print('PASS:',len(months),'months;',len(linked),'article links')
          PY
