name: Test category pagination build

on:
  pull_request:
    paths:
      - '_plugins/category_pagination.rb'
      - '_layouts/category.html'
      - '.github/workflows/test-category-pagination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Validate pagination, links and canonical URLs
        run: |
          python3 - <<'PY'
          import os, re, html, pathlib, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          root=pathlib.Path('_site')
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.links=[];self.canon=[];self.robots=[];self.cards=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
                  if tag=='link' and a.get('rel')=='canonical':self.canon.append(a.get('href'))
                  if tag=='meta' and a.get('name')=='robots':self.robots.append(a.get('content',''))
                  if tag=='article' and 'card' in a.get('class','').split():self.cards+=1
          categories=['pakistan','politics','economy','business','technology','world','explainer']
          tested=0
          for category in categories:
              first=root/category/'index.html'
              assert first.is_file(),f'Missing {first}'
              pages=sorted((root/category).glob('page/*/index.html'),key=lambda p:int(p.parent.name))
              allpages=[first]+pages
              for index,path in enumerate(allpages,1):
                  p=Page();p.feed(path.read_text())
                  expected=f'https://pakistanreport.pk/{category}/'+(f'page/{index}/' if index>1 else '')
                  assert p.canon==[expected],f'Canonical mismatch: {path}: {p.canon}'
                  assert p.cards<=12,f'More than 12 cards: {path}'
                  assert not any('noindex' in v for v in p.robots),f'noindex: {path}'
                  if index>1:
                      assert f'/{category}/' in p.links or f'/{category}/page/{index-1}/' in p.links,f'Missing previous navigation: {path}'
                  if index<len(allpages):
                      assert f'/{category}/page/{index+1}/' in p.links,f'Missing next navigation: {path}'
                  tested+=1
          sitemap=root/'sitemap.xml'
          assert sitemap.is_file(),'Missing sitemap.xml'
          xml=sitemap.read_text()
          for category in categories:
              assert f'https://pakistanreport.pk/{category}/' in xml,f'Category absent from sitemap: {category}'
          print(f'PASS: {tested} category pages; canonical, card limits, crawlability, links and sitemap')
          PY
